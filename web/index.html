<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mblint</title>
    <script>
      try {
        const root = document.documentElement;
        const theme = localStorage.getItem("mblint-theme");
        root.dataset.theme =
          theme === "light" || theme === "dark" ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        root.dataset.labels = localStorage.getItem("mblint-labels") === "on" ? "on" : "off";
        root.dataset.report = localStorage.getItem("mblint-report") === "off" ? "off" : "on";
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=optional"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>mblint <span>web simulator</span></h1>
      <span class="spacer"></span>
      <span id="status" class="status"></span>
      <label class="tool" title="Load board, device or rig TOML files">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5V2.5M4.5 6 8 2.5 11.5 6M2.5 10v3.5h11V10" /></svg>
        <span class="label">Load</span>
        <input id="file" type="file" accept=".toml" multiple hidden />
      </label>
      <button id="clear" class="tool" type="button" title="Remove every device from the rig">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M6.5 4.5v-2h3v2M4 4.5l.7 9h6.6l.7-9M6.8 7v4M9.2 7v4" /></svg>
        <span class="label">Clear</span>
      </button>
      <button id="report-toggle" class="tool" type="button" title="Show or hide the report">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h11v11h-11zM10 2.5v11" /></svg>
        <span class="label">Report</span>
      </button>
      <button id="labels" class="tool" type="button" title="Show or hide the names of these controls">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h7M2.5 12h9" /></svg>
        <span class="label">Names</span>
      </button>
      <button id="theme" class="tool theme-toggle" type="button" title="Switch between light and dark">
        <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" /><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1" /></svg>
        <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 1 1 6.5 2.5a4.5 4.5 0 0 0 7 7Z" /></svg>
        <span class="label">Theme</span>
      </button>
    </header>
    <div id="notices" class="notices" role="status"></div>
    <main>
      <aside class="panel sidebar picker">
        <h2>Boards</h2>
        <div id="boards" class="list"><p class="empty">Loading…</p></div>
        <h2>Parts</h2>
        <div id="parts" class="parts"></div>
      </aside>
      <section class="panel stage">
        <h2>Lane bracket</h2>
        <div id="bracket" class="bracket"></div>
        <p class="hint">Select a part, then a highlighted socket, or drag the part onto one. Drop TOML files anywhere to load them.</p>
      </section>
      <aside class="panel sidebar report-panel">
        <h2>Report</h2>
        <div id="report"></div>
        <h2>Links</h2>
        <div id="links" class="links"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
