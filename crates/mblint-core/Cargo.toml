[package]
name = "mblint-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
ts-rs = { version = "12", optional = true }
schemars = { version = "1", optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
serde_json = "1"
